name: Bug report
description: Report a reproducible problem with the local background remover.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not attach private images, credentials, tokens, or sensitive customer files.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the visible problem and what you expected instead.
      placeholder: The exported PNG...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest steps that reproduce the issue.
      placeholder: |
        1. Open the app
        2. Choose...
        3. Export...
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Edge 126, Chrome 126, Firefox 127

  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Windows 11

  - type: textarea
    id: image_details
    attributes:
      label: Image and settings
      description: Share non-sensitive details only.
      placeholder: JPEG, about 2000x2000, marketplace preset, warm sweep background, shadow enabled.

  - type: dropdown
    id: qa
    attributes:
      label: Did the QA command pass?
      options:
        - Not run
        - Passed
        - Failed
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant terminal output or attach non-private screenshots.
      render: text
