name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          npm_config_cache: /tmp/background-remover-npm-cache
          NPM_CONFIG_CACHE: /tmp/background-remover-npm-cache
        run: npm ci

      - name: Run checks
        run: npm run check
