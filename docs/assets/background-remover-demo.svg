<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Background Remover demo</title>
  <desc id="desc">Illustrative before and after product workflow for Background Remover using a generated product graphic.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7eee2"/>
      <stop offset="0.55" stop-color="#eff6f5"/>
      <stop offset="1" stop-color="#fffaf3"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.62" stop-color="#f1dfcb"/>
      <stop offset="1" stop-color="#e4c8ad"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#303238"/>
      <stop offset="0.7" stop-color="#181a1f"/>
      <stop offset="1" stop-color="#101115"/>
    </linearGradient>
    <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#ffffff"/>
      <rect width="14" height="14" fill="#dbe3e1"/>
      <rect x="14" y="14" width="14" height="14" fill="#dbe3e1"/>
    </pattern>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#171717" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#page)"/>
  <rect x="52" y="52" width="1176" height="616" rx="22" fill="#fffaf3" opacity="0.88"/>

  <g transform="translate(92 92)">
    <rect width="330" height="536" rx="16" fill="#fffaf3" stroke="#e7ded2"/>
    <rect x="28" y="30" width="52" height="52" rx="10" fill="#1e6d70"/>
    <path d="M45 56h27l-13 13H45z" fill="none" stroke="#fffaf3" stroke-width="4" stroke-linejoin="round"/>
    <text x="28" y="126" fill="#151515" font-family="Verdana, sans-serif" font-size="38" font-weight="700">Background</text>
    <text x="28" y="170" fill="#151515" font-family="Verdana, sans-serif" font-size="38" font-weight="700">Remover</text>
    <text x="28" y="222" fill="#55504a" font-family="Verdana, sans-serif" font-size="18">Local product cutouts,</text>
    <text x="28" y="248" fill="#55504a" font-family="Verdana, sans-serif" font-size="18">batch export, no credits.</text>

    <rect x="28" y="298" width="274" height="74" rx="12" fill="#e6f1ef"/>
    <circle cx="66" cy="335" r="18" fill="#1e6d70"/>
    <text x="96" y="328" fill="#173c3e" font-family="Verdana, sans-serif" font-size="16" font-weight="700">Processed ZIP</text>
    <text x="96" y="352" fill="#5f6a68" font-family="Verdana, sans-serif" font-size="13">Only completed images export.</text>

    <rect x="28" y="392" width="274" height="74" rx="12" fill="#fff7ed" stroke="#efd4c2"/>
    <circle cx="66" cy="429" r="18" fill="#d85136"/>
    <text x="96" y="422" fill="#5b2c22" font-family="Verdana, sans-serif" font-size="16" font-weight="700">Retry failed</text>
    <text x="96" y="446" fill="#765f55" font-family="Verdana, sans-serif" font-size="13">Failed queue items stay visible.</text>
  </g>

  <g transform="translate(456 92)">
    <rect width="330" height="536" rx="16" fill="#ffffff" stroke="#e7ded2"/>
    <text x="26" y="46" fill="#26231f" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Before</text>
    <rect x="26" y="70" width="278" height="394" rx="12" fill="url(#warm)"/>
    <ellipse cx="165" cy="410" rx="86" ry="22" fill="#a77348" opacity="0.22"/>
    <g filter="url(#shadow)">
      <path d="M122 169h92l-13 227h-66z" fill="#1e6d70"/>
      <path d="M111 151h113l-10 34H121z" fill="#d85136"/>
      <path d="M137 111h60l14 40h-88z" fill="#fffaf3" stroke="#1e6d70" stroke-width="8"/>
      <path d="M214 205c36 8 48 37 34 66-12 26-33 37-55 31l4-42c18 1 30-8 31-24 1-13-7-23-19-27z" fill="#fffaf3" stroke="#1e6d70" stroke-width="8"/>
    </g>
    <text x="26" y="504" fill="#67615b" font-family="Verdana, sans-serif" font-size="14">Generated product source</text>
  </g>

  <g transform="translate(820 92)">
    <rect width="330" height="536" rx="16" fill="#ffffff" stroke="#e7ded2"/>
    <text x="26" y="46" fill="#26231f" font-family="Verdana, sans-serif" font-size="18" font-weight="700">After</text>
    <rect x="26" y="70" width="278" height="394" rx="12" fill="url(#checker)"/>
    <rect x="50" y="92" width="230" height="348" rx="14" fill="url(#graphite)" opacity="0.96"/>
    <ellipse cx="165" cy="404" rx="96" ry="26" fill="#ffffff" opacity="0.15"/>
    <ellipse cx="165" cy="412" rx="78" ry="18" fill="#000000" opacity="0.22"/>
    <g filter="url(#shadow)">
      <path d="M122 169h92l-13 227h-66z" fill="#1e6d70"/>
      <path d="M111 151h113l-10 34H121z" fill="#d85136"/>
      <path d="M137 111h60l14 40h-88z" fill="#fffaf3" stroke="#1e6d70" stroke-width="8"/>
      <path d="M214 205c36 8 48 37 34 66-12 26-33 37-55 31l4-42c18 1 30-8 31-24 1-13-7-23-19-27z" fill="#fffaf3" stroke="#1e6d70" stroke-width="8"/>
    </g>
    <text x="26" y="504" fill="#67615b" font-family="Verdana, sans-serif" font-size="14">Marketplace preset + shadow</text>
  </g>
</svg>
